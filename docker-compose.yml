version: '3.8'

services:
  backend:
    build:
      context: ./PEM-Backend
      dockerfile: Dockerfile
    container_name: pem_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./PEM-Backend/.env

  frontend:
    build:
      context: ./PEM-Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: pem_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
